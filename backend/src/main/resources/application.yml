
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: shopsphere-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shopsphere_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000"

logging:
  level:
    com.shopsphere: INFO
    org.springframework.security: WARN
